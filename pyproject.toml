[project]
name = "indecis-vizdoom"
version = "0.1.0"
description = "Playing ViZDoom with a small indecis decision model"
requires-python = ">=3.12,<3.13"
dependencies = ["vizdoom==1.3.1"]

[dependency-groups]
dev = [
    "pytest>=8",
]
show = [
    "pygame-ce==2.5.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indecis_vizdoom"]
